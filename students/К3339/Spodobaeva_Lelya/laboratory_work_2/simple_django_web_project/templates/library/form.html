{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="panel">
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
            <button class="button" type="submit">Сохранить</button>
            <a class="button secondary" href="{% url 'tour_list' %}">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
